<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Stepwise focused presentation mock</title>
  <desc id="desc">A centered in-app modal for Spaghetti Carbonara showing a single active step card, step count, progress dots, a compact cue row, and navigation controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#EDF2F8"/>
    </linearGradient>
    <radialGradient id="glowOne" cx="0.22" cy="0.18" r="0.34">
      <stop offset="0%" stop-color="#6B7CFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTwo" cx="0.82" cy="0.22" r="0.28">
      <stop offset="0%" stop-color="#43C6A7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#43C6A7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowThree" cx="0.76" cy="0.82" r="0.28">
      <stop offset="0%" stop-color="#FFB86B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFB86B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E64F6"/>
      <stop offset="100%" stop-color="#7A8DFF"/>
    </linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#32C66B"/>
      <stop offset="100%" stop-color="#42D17A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#22304D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#22304D" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 40px/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #132039; letter-spacing: -0.8px; }
      .subtitle { font: 600 18px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5D6780; }
      .caption { font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #44506A; letter-spacing: 0.08em; }
      .body { font: 400 18px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4B556D; }
      .note { font: 500 15px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #60708A; }
      .buttonLabel { font: 600 17px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 600 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627089; letter-spacing: 0.06em; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="190" cy="170" r="220" fill="url(#glowOne)"/>
  <circle cx="960" cy="170" r="220" fill="url(#glowTwo)"/>
  <circle cx="920" cy="720" r="240" fill="url(#glowThree)"/>

  <g filter="url(#shadow)">
    <rect x="126" y="82" width="948" height="736" rx="38" fill="#FFFFFF" fill-opacity="0.84" stroke="#D7DDE9" stroke-opacity="0.95"/>
  </g>

  <text class="title" x="176" y="160">Spaghetti Carbonara</text>
  <text class="subtitle" x="176" y="194">Step 2 of 5</text>

  <g transform="translate(936 130)">
    <rect x="0" y="0" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#D7DDE8"/>
    <path d="M16 16 L28 28 M28 16 L16 28" stroke="#59627B" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text class="small" x="1000" y="158">Close</text>

  <g transform="translate(176 224)">
    <rect x="0" y="0" width="18" height="8" rx="4" fill="#CBD3E1"/>
    <rect x="26" y="0" width="18" height="8" rx="4" fill="#CBD3E1"/>
    <rect x="52" y="0" width="18" height="8" rx="4" fill="url(#accent)"/>
    <rect x="78" y="0" width="18" height="8" rx="4" fill="#E1E6F0"/>
    <rect x="104" y="0" width="18" height="8" rx="4" fill="#E1E6F0"/>
  </g>

  <g transform="translate(176 258)">
    <rect x="0" y="0" width="848" height="54" rx="18" fill="#F7FAFF" stroke="#DCE4F1"/>
    <rect x="18" y="12" width="30" height="30" rx="10" fill="#EEF2FF"/>
    <circle cx="33" cy="27" r="4" fill="#5E64F6"/>
    <text class="caption" x="64" y="32">ACTIVE CUE</text>
    <text class="note" x="182" y="32">120 g spaghetti</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="176" y="336" width="848" height="318" rx="32" fill="#FFFFFF" stroke="#E1E7F2"/>
  </g>
  <rect x="176" y="336" width="848" height="8" rx="4" fill="url(#accent)"/>

  <g transform="translate(214 378)">
    <rect x="0" y="0" width="116" height="32" rx="16" fill="#EEF2FF"/>
    <text class="small" x="58" y="21" text-anchor="middle" fill="#5E64F6">ACTIVE STEP</text>
  </g>

  <text class="title" x="214" y="462" font-size="48">Whisk the eggs and cheese</text>
  <text class="body" x="214" y="508">Combine the yolks, pecorino, and black pepper in a bowl until the mixture is glossy.</text>
  <text class="body" x="214" y="540">Keep the pasta water nearby so the sauce can be loosened at the end.</text>

  <g transform="translate(214 588)">
    <rect x="0" y="0" width="170" height="40" rx="20" fill="#F8FAFF" stroke="#D8E0EE"/>
    <text class="note" x="85" y="26" text-anchor="middle">Read aloud ready</text>
  </g>

  <g transform="translate(176 720)">
    <rect x="0" y="0" width="112" height="46" rx="16" fill="#FFFFFF" stroke="#D8DFEA"/>
    <text class="buttonLabel" x="56" y="29" text-anchor="middle" fill="#4C5770">Previous</text>

    <rect x="128" y="0" width="88" height="46" rx="16" fill="#FFFFFF" stroke="#D8DFEA"/>
    <text class="buttonLabel" x="172" y="29" text-anchor="middle" fill="#4C5770">Read</text>

    <rect x="232" y="0" width="104" height="46" rx="16" fill="#FFFFFF" stroke="#D8DFEA"/>
    <text class="buttonLabel" x="284" y="29" text-anchor="middle" fill="#4C5770">Repeat</text>

    <rect x="352" y="0" width="90" height="46" rx="16" fill="#FFFFFF" stroke="#D8DFEA"/>
    <text class="buttonLabel" x="397" y="29" text-anchor="middle" fill="#4C5770">Next</text>

    <rect x="726" y="0" width="122" height="46" rx="16" fill="url(#done)"/>
    <text class="buttonLabel" x="787" y="29" text-anchor="middle" fill="#FFFFFF">Mark done</text>
  </g>
</svg>
